name: Security & Code Quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.14.5'

jobs:
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Check SonarQube configuration
        id: sonar-config
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube secrets are not configured. SonarQube analysis will be skipped."
          fi

      - name: Run tests and coverage
        if: steps.sonar-config.outputs.enabled == 'true'
        run: |
          gradle clean test jacocoTestReport --no-daemon

      - name: Run SonarQube analysis
        if: steps.sonar-config.outputs.enabled == 'true'
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PROJECT_NAME: ${{ vars.SONAR_PROJECT_NAME }}
        run: |
          gradle sonar             --no-daemon             -Dsonar.host.url="$SONAR_HOST_URL"             -Dsonar.token="$SONAR_TOKEN"             -Dsonar.projectKey="${SONAR_PROJECT_KEY:-procurement-platform-foundation}"             -Dsonar.projectName="${SONAR_PROJECT_NAME:-Procurement Platform Foundation}"             -Dsonar.qualitygate.wait=true             -Dsonar.qualitygate.timeout=300

  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Trivy ignore file
        shell: bash
        run: |
          if [ ! -f ".trivyignore" ]; then
            echo "::error::.trivyignore file is missing."
            exit 1
          fi
          echo "Using Trivy ignore file:"
          cat .trivyignore

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: table

  trivy-container:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Trivy ignore file
        shell: bash
        run: |
          if [ ! -f ".trivyignore" ]; then
            echo "::error::.trivyignore file is missing."
            exit 1
          fi
          echo "Using Trivy ignore file:"
          cat .trivyignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/api-gateway/Dockerfile
          load: true
          push: false
          tags: procurement/api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: procurement/api-gateway:${{ github.sha }}
          scan-type: image
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: table

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm             -v "${GITHUB_WORKSPACE}:/repo:ro"             ghcr.io/gitleaks/gitleaks:v8.30.1             git             --redact             --exit-code 1             /repo

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - sonar
      - trivy-filesystem
      - trivy-container
      - gitleaks
    if: always()
    steps:
      - name: Evaluate security results
        shell: bash
        run: |
          set -euo pipefail
          echo "======================================"
          echo "Security & Code Quality Summary"
          echo "======================================"
          echo "SonarQube:        ${{ needs.sonar.result }}"
          echo "Trivy Filesystem: ${{ needs.trivy-filesystem.result }}"
          echo "Trivy Container:  ${{ needs.trivy-container.result }}"
          echo "Gitleaks:         ${{ needs.gitleaks.result }}"
          echo "======================================"

          if [ "${{ needs.trivy-filesystem.result }}" != "success" ]; then
            echo "::error::Trivy filesystem scan failed."
            exit 1
          fi
          if [ "${{ needs.trivy-container.result }}" != "success" ]; then
            echo "::error::Trivy container scan failed."
            exit 1
          fi
          if [ "${{ needs.gitleaks.result }}" != "success" ]; then
            echo "::error::Gitleaks scan failed."
            exit 1
          fi
          if [ "${{ needs.sonar.result }}" = "failure" ]; then
            echo "::error::SonarQube analysis failed."
            exit 1
          fi
          if [ "${{ needs.sonar.result }}" = "skipped" ]; then
            echo "::notice::SonarQube analysis was skipped."
          fi

          echo "======================================"
          echo "All required security checks passed."
          echo "======================================"

  # AWS SECURITY EXCEPTION
  #
  # Intentional public internet-facing ALB.
  # The ALB is the application's public edge and is protected
  # by AWS WAF.
  # Internal application workloads remain in private subnets.
  # AWS-0053
