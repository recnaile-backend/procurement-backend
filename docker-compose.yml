      MONGODB_DATABASE: master_data
      MASTER_DATA_MONGODB_URI: ${MONGODB_BASE_URI}/master_data?retryWrites=true&w=majority&appName=recnaile
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on: [kafka, otel-collector]
    expose: ["8082"]
