# Loki single-binary config suitable for a small-to-mid cluster deployment (scale to
# simple-scalable or microservices mode as log volume grows). Logs arrive via the
# cluster's log-shipping agent (e.g. Promtail/Grafana Agent DaemonSet, or via the OTel
# Collector's loki exporter) reading container stdout — see
# docs/observability/logging-standard.md.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h   # 14 days local retention; production may back this with S3
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
