# ExternalSecret template — one per service per credential type, rendered by the Helm
# chart or applied directly. Syncs an AWS Secrets Manager entry into a Kubernetes Secret
# (architecture/security-architecture.md §5). The SecretStore below is cluster-scoped and
# shared; individual ExternalSecret resources are namespaced per service.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-operator
            namespace: kube-system
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: "{{ .Values.serviceName }}-mongodb-credentials"
  namespace: "{{ .Values.namespace }}"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: "{{ .Values.serviceName }}-mongodb-credentials"
  data:
    - secretKey: value
      remoteRef:
        key: "procurement/{{ .Values.namespace }}/{{ .Values.serviceName }}/mongodb-credentials"
