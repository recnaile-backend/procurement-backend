# Tempo config — receives OTLP traces (forwarded by the OpenTelemetry Collector) and
# stores them for Grafana's trace view / traces-to-logs correlation
# (architecture/observability-architecture.md §1).
server:
  http_listen_port: 3100

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 336h  # 14 days local; production may back this with S3

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
