# Alertmanager routing — page vs notify severities (architecture/observability-architecture.md §5).
route:
  receiver: default-notify
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="page"
      receiver: oncall-page
      continue: false
    - matchers:
        - severity="notify"
      receiver: default-notify

receivers:
  - name: oncall-page
    # PagerDuty integration key supplied via Secrets Manager -> External Secrets ->
    # this config's templated value at deploy time — never hardcoded here.
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_ROUTING_KEY}
        severity: critical

  - name: default-notify
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: "#platform-alerts"
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="page"]
    target_matchers: [severity="notify"]
    equal: ["service"]
