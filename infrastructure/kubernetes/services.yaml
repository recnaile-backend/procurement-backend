apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: procurement
spec:
  replicas: 2
  selector:
    matchLabels: {app: notification-service}
  template:
    metadata:
      labels: {app: notification-service}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: notification-service
          image: ghcr.io/software-recnaile/notification-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: SERVICE_PORT
              value: "8090"
            - name: API_GATEWAY_PORT
              value: "8080"
            - name: MONGODB_DATABASE
              value: "notification"
            - name: MONGODB_BASE_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-atlas-secret
                  key: MONGODB_BASE_URI
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: {configMapKeyRef: {name: procurement-service-config, key: KAFKA_BOOTSTRAP_SERVERS}}
            - name: REDIS_HOST
              valueFrom: {configMapKeyRef: {name: procurement-service-config, key: REDIS_HOST}}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom: {configMapKeyRef: {name: procurement-service-config, key: OTEL_EXPORTER_OTLP_ENDPOINT}}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
      volumes:
        - name: tmp
          emptyDir: {}
---
