---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: procurement
spec:
  replicas: 2
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api-gateway
          image: ghcr.io/software-recnaile/api-gateway:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_PORT
              value: "8080"
            - name: API_GATEWAY_PORT
              value: "8080"
            - name: MONGODB_DATABASE
              value: "gateway"
            - name: MONGODB_BASE_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-atlas-secret
                  key: MONGODB_BASE_URI
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: {configMapKeyRef: {name: procurement-service-config, key: KAFKA_BOOTSTRAP_SERVERS}}
            - name: REDIS_HOST
              valueFrom: {configMapKeyRef: {name: procurement-service-config, key: REDIS_HOST}}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom: {configMapKeyRef: {name: procurement-service-config, key: OTEL_EXPORTER_OTLP_ENDPOINT}}
            - name: AUTH_SERVICE_SERVICE_URL
              value: http://auth-service:8081
            - name: MASTER_DATA_SERVICE_SERVICE_URL
              value: http://master-data-service:8082
            - name: INDENT_SERVICE_SERVICE_URL
              value: http://indent-service:8083
            - name: PURCHASE_ORDER_SERVICE_SERVICE_URL
              value: http://purchase-order-service:8084
            - name: INWARD_SERVICE_SERVICE_URL
              value: http://inward-service:8085
            - name: INVENTORY_SERVICE_SERVICE_URL
              value: http://inventory-service:8086
            - name: OUTWARD_SERVICE_SERVICE_URL
              value: http://outward-service:8087
            - name: RETURN_SERVICE_SERVICE_URL
              value: http://return-service:8088
            - name: ASSET_SERVICE_SERVICE_URL
              value: http://asset-service:8089
            - name: NOTIFICATION_SERVICE_SERVICE_URL
              value: http://notification-service:8090
            - name: AUDIT_SERVICE_SERVICE_URL
              value: http://audit-service:8091
            - name: REPORTING_SERVICE_SERVICE_URL
              value: http://reporting-service:8092
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: procurement
spec:
  selector: {app: api-gateway}
  ports:
    - name: http
      port: 8080
      targetPort: http

