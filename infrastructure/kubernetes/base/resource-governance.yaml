        cpu: "2"
        memory: 2Gi
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-critical
value: 1000000
globalDefault: false
description: "API Gateway, auth-service — must be scheduled/evicted last."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-standard
value: 100000
globalDefault: true
description: "Default priority for the remaining domain services."
