# Template — one ServiceAccount + Role + RoleBinding per domain service, rendered by
# the Helm chart (infrastructure/helm/procurement-service-chart) with the service name
# substituted in. Shown here standalone for clarity/review; the chart's
# templates/serviceaccount.yaml and templates/rbac.yaml are the actual source of truth
# applied to the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Values.serviceName }}"
  namespace: "{{ .Values.namespace }}"
  annotations:
    # IRSA — maps this ServiceAccount to a least-privilege AWS IAM role scoped to
    # exactly what this service needs (e.g. S3 prefix access for inward-service).
    eks.amazonaws.com/role-arn: "{{ .Values.aws.iamRoleArn }}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ .Values.serviceName }}-role"
  namespace: "{{ .Values.namespace }}"
rules:
  # Read-only access to this service's own ConfigMap/Secret — nothing cluster-scoped,
  # nothing belonging to another service.
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    resourceNames: ["{{ .Values.serviceName }}-config", "{{ .Values.serviceName }}-secret"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ .Values.serviceName }}-rolebinding"
  namespace: "{{ .Values.namespace }}"
subjects:
  - kind: ServiceAccount
    name: "{{ .Values.serviceName }}"
    namespace: "{{ .Values.namespace }}"
roleRef:
  kind: Role
  name: "{{ .Values.serviceName }}-role"
  apiGroup: rbac.authorization.k8s.io
