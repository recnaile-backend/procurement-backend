apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: procurement-gateway
  namespace: procurement
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: procurement-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
