spring:
  application:
    name: reporting-service
  data:
    mongodb:
      auto-index-creation: false
      uri: ${MONGODB_BASE_URI:mongodb://mongo:27017}/${MONGODB_DATABASE:reporting}?retryWrites=true&w=majority&appName=recnaile
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:reporting-service}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:1}
server:
  port: ${SERVICE_PORT:8092}
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:}
app:
  service-name: reporting-service
  description: "Read-optimized procurement reporting boundary"
  kafka:
    topic-pattern: ${REPORTING_TOPIC_PATTERN:.*(indent|purchase|po-|inward|goods|inventory|outward|return|asset|sla|audit).*}
