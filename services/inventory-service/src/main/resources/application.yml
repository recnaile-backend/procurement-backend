spring:
  application:
    name: inventory-service
  data:
    mongodb:
      uri: ${MONGODB_BASE_URI}/${MONGODB_DATABASE:inventory}?retryWrites=true&w=majority&appName=recnaile
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: ${KAFKA_INVENTORY_GROUP_ID:inventory-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      retries: 5
server:
  port: ${SERVICE_PORT:8086}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
app:
  service-name: inventory-service
  description: "Stock ledger, availability, min/max stock and low-stock state"
  kafka:
    events-topic: ${INVENTORY_EVENTS_TOPIC:procurement.events}
    outbox-topic: ${INVENTORY_OUTBOX_TOPIC:procurement.events}
    outbox-publish-delay-ms: ${INVENTORY_OUTBOX_PUBLISH_DELAY_MS:1000}
  security:
    jwt:
      issuer-uri: ${APP_SECURITY_JWT_ISSUER_URI:${JWT_ISSUER:auth-service}}


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
    deep-linking: true
