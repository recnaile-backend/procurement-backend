spring:
  application:
    name: master-data-service

  data:
    mongodb:
      uri: ${MASTER_DATA_MONGODB_URI}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

server:
  port: ${SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      probes:
        enabled: true

  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}

app:
  service-name: master-data-service
  description: "Departments, projects, vendors and item master"

  jwt:
    issuer: ${JWT_ISSUER:auth-service}
    secret-key: ${JWT_SECRET_KEY}