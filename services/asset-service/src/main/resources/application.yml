spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: manual
  application:
    name: ${APP_SERVICE_NAME:asset-service}
  data:
    mongodb:
      uri: ${MONGODB_BASE_URI:mongodb://localhost:27017}/${MONGODB_DATABASE:assetdb}?retryWrites=true&w=majority&appName=recnaile

server:
  port: ${SERVICE_PORT:8089}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    consumer-group: ${ASSET_KAFKA_CONSUMER_GROUP:asset-service}
    topics:
      stock-issue-approved: ${KAFKA_STOCK_ISSUE_APPROVED_TOPIC:stock-issue-approved}
      return-accepted: ${KAFKA_RETURN_ACCEPTED_TOPIC:return-accepted}
  service-name: ${APP_SERVICE_NAME:asset-service}
  description: ${APP_SERVICE_DESCRIPTION:Reusable asset lifecycle and employee assignment}
  database-name: ${MONGODB_DATABASE:assetdb}
