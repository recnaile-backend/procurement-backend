spring:
  application:
    name: ${APP_SERVICE_NAME:return-service}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        compression.type: gzip
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.in.flight.requests.per.connection: 5
  data:
    mongodb:
      uri: ${MONGODB_BASE_URI:mongodb://localhost:27017}/${MONGODB_DATABASE:returndb}?retryWrites=true&w=majority&appName=recnaile

server:
  port: ${SERVICE_PORT:8088}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  security:
    jwt:
      mode: ${JWT_MODE:hs256}
      secret: ${JWT_SECRET_KEY:}
      issuer: ${JWT_ISSUER:auth-service}
      jwk-set-uri: ${JWT_JWK_SET_URI:http://auth-service:8081/oauth2/jwks}
  integrations:
    outward-service:
      base-url: ${OUTWARD_SERVICE_BASE_URL:http://outward-service:8087}
      connect-timeout-ms: ${OUTWARD_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${OUTWARD_READ_TIMEOUT_MS:5000}
  kafka:
    topics:
      return-recorded: ${KAFKA_RETURN_RECORDED_TOPIC:return.recorded}
      return-accepted: ${KAFKA_RETURN_ACCEPTED_TOPIC:return-accepted}
      audit: ${KAFKA_AUDIT_TOPIC:audit.events}
      notification: ${KAFKA_NOTIFICATION_TOPIC:notification.events}
  outbox:
    dispatch-enabled: ${RETURN_OUTBOX_DISPATCH_ENABLED:true}
    dispatch-interval-ms: ${RETURN_OUTBOX_DISPATCH_INTERVAL_MS:5000}
  integration-outbox:
    dispatch-enabled: ${RETURN_INTEGRATION_OUTBOX_DISPATCH_ENABLED:true}
    dispatch-interval-ms: ${RETURN_INTEGRATION_OUTBOX_DISPATCH_INTERVAL_MS:5000}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${PLATFORM_VERSION:1.0.0}
        environment: ${SPRING_PROFILES_ACTIVE:dev}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.recnaile.returns.controller
  paths-to-match: /api/v1/**
