spring:
  application:
    name: return-service-test
  data:
    mongodb:
      uri: mongodb://localhost:27017/return-test
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

app:
  outbox:
    dispatch-enabled: false
  integration-outbox:
    dispatch-enabled: false
  integrations:
    outward-service:
      base-url: http://outward-service:8087
      connect-timeout-ms: 1000
      read-timeout-ms: 1000
  security:
    jwt:
      secret: test-test-test-test-test-test-test-test
      mode: hs256
      issuer: auth-service
      jwk-set-uri: http://localhost:8081/oauth2/jwks
