spring:
  application:
    name: outward-service

  data:
    mongodb:
      uri: ${MONGODB_BASE_URI}/${MONGODB_DATABASE:outward}?retryWrites=true&w=majority&appName=recnaile
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:true}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      acks: all
      enable-idempotence: true
      compression-type: zstd
      retries: 2147483647
      delivery-timeout-ms: 120000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    template:
      observation-enabled: true

server:
  port: ${OUTWARD_SERVICE_PORT:${SERVICE_PORT:8087}}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
    propagation:
      type: w3c
  observations:
    annotations:
      enabled: true
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}}
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:true}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}}
        step: ${OTEL_METRICS_EXPORT_STEP:30s}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}

logging:
  structured:
    format:
      console: ecs
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-} %logger{36} - %msg%n'

app:
  service-name: outward-service
  description: "Stock issue requests, approval and issue transactions"
  security:
    jwt:
      issuer-uri: ${JWT_ISSUER:auth-service}
      secret-key: ${JWT_SECRET_KEY}
  authorization:
    department-claim: ${OUTWARD_APPROVAL_DEPARTMENT_CLAIM:departmentName}
    approval-roles: ${OUTWARD_APPROVAL_ROLES:TL,MD}
  observability:
    correlation-header: ${CORRELATION_HEADER:X-Correlation-Id}
  clients:
    master-data-base-url: ${MASTER_DATA_SERVICE_URL:${MASTER_DATA_BASE_URL:http://master-data-service:8082}}
    auth-base-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
    connect-timeout-ms: ${MASTER_DATA_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${MASTER_DATA_READ_TIMEOUT_MS:3000}
  kafka:
    topics:
      outward-issued: ${OUTWARD_ISSUED_TOPIC:outward.events}
      audit: ${AUDIT_EVENTS_TOPIC:audit.events}
      notification: ${NOTIFICATION_EVENTS_TOPIC:notification.events}
    publisher:
      fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:1000}
      send-timeout-ms: ${OUTBOX_PUBLISHER_SEND_TIMEOUT_MS:5000}
      max-attempts: ${OUTBOX_PUBLISHER_MAX_ATTEMPTS:10}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
