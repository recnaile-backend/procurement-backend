spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: ${MONGODB_BASE_URI:mongodb://localhost:27017}/${MONGODB_DATABASE:notification}?retryWrites=true&w=majority&appName=recnaile
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:notification-service}
      enable-auto-commit: false
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: manual
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
server:
  port: ${SERVICE_PORT:8090}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
app:
  security:
    jwt:
      # Matches Auth Service HS256 signing and JWT_ISSUER configuration.
      secret-key: ${JWT_SECRET_KEY}
      issuer: ${JWT_ISSUER:auth-service}
  service-name: notification-service
  description: "Event-driven in-app notification orchestration"
  kafka:
    topics:
      indent: ${KAFKA_INDENT_TOPIC:procurement.indent.events}
      purchase-order: ${KAFKA_PO_TOPIC:procurement.po.events}
      inward: ${KAFKA_INWARD_TOPIC:procurement.inward.events}
      inventory: ${KAFKA_INVENTORY_TOPIC:procurement.inventory.events}
      outward: ${KAFKA_OUTWARD_TOPIC:procurement.outward.events}
      return: ${KAFKA_RETURN_TOPIC:procurement.return.events}
      asset: ${KAFKA_ASSET_TOPIC:procurement.asset.events}
    retry-suffix: ${KAFKA_RETRY_SUFFIX:.retry}
    dlt-suffix: ${KAFKA_DLT_SUFFIX:.dlt}
    retry-interval-ms: ${KAFKA_RETRY_INTERVAL_MS:1000}
    retry-attempts: ${KAFKA_RETRY_ATTEMPTS:3}
    audit-topic: ${KAFKA_AUDIT_TOPIC:procurement.audit.events}
