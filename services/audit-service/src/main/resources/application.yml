spring:
  application:
    name: audit-service
  data:
    mongodb:
      auto-index-creation: true
      uri: ${MONGODB_BASE_URI}/${MONGODB_DATABASE:audit}?retryWrites=true&w=majority&appName=recnaile
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:audit-service.audit-events}
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
server:
  port: ${SERVICE_PORT:8091}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
app:
  service-name: audit-service
  description: "Immutable audit trail for create/edit/approve/reject operations"
  kafka:
    audit-topic: ${KAFKA_AUDIT_TOPIC:procurement.audit.events}
