openapi: 3.0.3
info:
  title: RECNAILE Audit Service API
  version: 1.0.0
  description: Read-only access to immutable audit event history. Authentication and authorization are enforced by the service.
servers:
  - url: /
tags:
  - name: Audit Events
    description: Read-only audit history queries
security:
  - bearerAuth: []

paths:
  /api/v1/audit-events/{eventId}:
    get:
      tags: [Audit Events]
      summary: Get one audit event by UUID
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Event found }
        '400': { description: Invalid UUID }
        '404': { description: Event not found }
        '401': { description: Valid bearer JWT required }
        '403': { description: Access denied by role or event scope }
        '500': { description: Unexpected server error }
  /api/v1/audit-events/entities/{entityType}/{entityId}:
    get:
      tags: [Audit Events]
      summary: Get entity history
      parameters:
        - { name: entityType, in: path, required: true, schema: { type: string } }
        - { name: entityId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated entity audit history }
        '400': { description: Invalid pagination parameters }
  /api/v1/audit-events/actors/{actorId}:
    get:
      tags: [Audit Events]
      summary: Get actor history
      parameters:
        - { name: actorId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated actor audit history }
        '400': { description: Invalid pagination parameters }
  /api/v1/audit-events/correlations/{correlationId}:
    get:
      tags: [Audit Events]
      summary: Find events by correlation ID
      parameters:
        - { name: correlationId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated correlation history }
        '400': { description: Invalid pagination parameters }
  /api/v1/audit-events/traces/{traceId}:
    get:
      tags: [Audit Events]
      summary: Find events by trace ID
      parameters:
        - { name: traceId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated trace history }
        '400': { description: Invalid pagination parameters }
  /api/v1/audit-events/services/{service}/actions/{action}:
    get:
      tags: [Audit Events]
      summary: Find events by service and action
      parameters:
        - { name: service, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated service/action history }
        '400': { description: Invalid pagination parameters }
  /api/v1/audit-events/operations/replay:
    post:
      tags: [Audit Events]
      summary: Validate and republish one failed AUDIT_EVENT envelope (MD only)
      description: This endpoint does not consume or delete DLT records automatically. The caller supplies one raw event envelope for validation and republishing. Event-ID idempotency applies during ingestion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rawEventJson]
              properties:
                rawEventJson: { type: string, minLength: 1 }
      responses:
        '202': { description: Event validated and broker confirmed publication }
        '400': { description: Invalid event JSON or event contract }
        '403': { description: MD role required }
        '500': { description: Broker did not confirm publication }
  /api/v1/audit-events/operations/retention-preview:
    get:
      tags: [Audit Events]
      summary: Preview retention candidates without deleting records (MD only)
      responses:
        '200': { description: Retention preview; no records are deleted or modified }
        '403': { description: MD role required }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        traceId: { type: string, nullable: true }
    PaginatedData:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { type: object } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
